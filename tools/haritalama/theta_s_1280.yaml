# stella_vslam_dense ayarı: Theta S, kalibre dikişle üretilmiş 1280x640 eşdikdörtgen (esdikdortgen.py), 15 fps.
# Taban: depodaki example/dense/dense_hd.yaml. Değişenler yalnızca kamera boyutu/fps ve maske
# (robot gövdesi maske.png ile verilir, dikdörtgen maske yok) ve PatchMatch tam çözünürlükte (1280x640):
# parke kaydında 640x320e göre 3,3 kat nokta ve daha keskin yapı verdi (gevşek süzgeç ise gürültü ekledi).

Camera:
  name: "Theta S 1280x640"
  setup: "monocular"
  model: "equirectangular"
  fps: 15.0
  cols: 1280
  rows: 640
  color_order: "BGR"

Preprocessing:
  min_size: 800

Feature:
  name: "default ORB feature extraction setting"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.95

LoopDetector:
  enabled: true
  reject_by_graph_distance: true
  min_distance_on_graph: 50

SocketPublisher:
  image_quality: 80

PatchMatch:
  enabled: true
  cols: 1280
  rows: 640
  min_patch_std_dev: 0
  patch_size: 7
  patchmatch_iterations: 4
  min_score: 0.1
  min_consistent_views: 3
  depthmap_queue_size: 5
  depthmap_same_depth_threshold: 0.08
  min_views: 1
  pointcloud_queue_size: 4
  pointcloud_same_depth_threshold: 0.08
  min_stereo_score: 0
