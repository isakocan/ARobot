# stella_vslam_dense ayari: 1280x640 / 15 fps Theta S eşdikdörtgen; taban example/dense/dense_hd.yaml + tools/slam_deneme/ayar_ekdortgen_paralaks2.yaml
Camera:
  name: "Theta S levelled equirect 1280x640"
  setup: "monocular"
  model: "equirectangular"
  fps: 15.0
  cols: 1280
  rows: 640
  color_order: "BGR"

Preprocessing:
  min_size: 800
  mask_rectangles:
    - [0.0, 1.0, 0.0, 0.06]
    - [0.0, 1.0, 0.94, 1.0]

Feature:
  name: "ORB"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.95

Initializer:
  parallax_deg_threshold: 2.0

LoopDetector:
  enabled: true
  reject_by_graph_distance: true
  min_distance_on_graph: 50

PatchMatch:
  enabled: true
  cols: 640
  rows: 320
  min_patch_std_dev: 0
  patch_size: 7
  patchmatch_iterations: 4
  min_score: 0.1
  min_consistent_views: 3
  depthmap_queue_size: 5
  depthmap_same_depth_threshold: 0.08
  min_views: 1
  pointcloud_queue_size: 4
  pointcloud_same_depth_threshold: 0.08
  min_stereo_score: 0
