# stella_vslam ayarı: Theta S eşdikdörtgen, 1280x640 (kendi kalibre dönüşümümüz). Taban: stella_vslam/example/aist/equirectangular.yaml
Camera:
  name: "Theta S levelled equirect 1280x640"
  setup: "monocular"
  model: "equirectangular"
  fps: 15.0
  cols: 1280
  rows: 640
  color_order: "BGR"

Preprocessing:
  min_size: 800
  mask_rectangles:      # kutup bölgeleri (aşırı gerilmiş); gövde maskesi ayrı dosyadan (maske.png)
    - [0.0, 1.0, 0.0, 0.06]
    - [0.0, 1.0, 0.94, 1.0]

Feature:
  name: "ORB"
  scale_factor: 1.2
  num_levels: 8
  ini_fast_threshold: 20
  min_fast_threshold: 7

Mapping:
  backend: "g2o"
  baseline_dist_thr_ratio: 0.02
  redundant_obs_ratio_thr: 0.95
  num_covisibilities_for_landmark_generation: 20
  num_covisibilities_for_landmark_fusion: 20
  residual_deg_thr: 0.4

Tracking:
  backend: "g2o"

LoopDetector:
  backend: "g2o"
  enabled: true
  reject_by_graph_distance: true
  min_distance_on_graph: 50

GraphOptimizer:
  min_num_shared_lms: 200

GlobalOptimizer:
  thr_neighbor_keyframes: 100

System:
  map_format: "msgpack"
  num_grid_cols: 64
  num_grid_rows: 32
